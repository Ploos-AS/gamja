services:
  soju:
    image: ghcr.io/ploos-as/soju:latest@sha256:ae1eb58d75beea7bfbeff3f004700289f2fcd4c56da671d88216f2cfb2d1d491
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["-config", "/etc/soju/config"]
    volumes:
      - ./soju.conf:/etc/soju/config:ro
      - soju-data:/var/lib/soju
    networks:
      - irc
    healthcheck:
      test: ["CMD-SHELL", "sojudb -config /etc/soju/config help >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  gamja:
    image: ghcr.io/ploos-as/gamja:latest
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      soju:
        condition: service_healthy
    environment:
      SOJU_HOST: soju
      SOJU_PORT: 8080
      GAMJA_SERVER_URL: /socket
      GAMJA_AUTH: ${GAMJA_AUTH:-optional}
      GAMJA_AUTOJOIN: ${GAMJA_AUTOJOIN:-}
      GAMJA_NICK: ${GAMJA_NICK:-}
      GAMJA_AUTOCONNECT: ${GAMJA_AUTOCONNECT:-}
      GAMJA_PING: ${GAMJA_PING:-}
      GAMJA_OAUTH2_URL: ${GAMJA_OAUTH2_URL:-}
      GAMJA_OAUTH2_CLIENT_ID: ${GAMJA_OAUTH2_CLIENT_ID:-}
      GAMJA_OAUTH2_CLIENT_SECRET: ${GAMJA_OAUTH2_CLIENT_SECRET:-}
      GAMJA_OAUTH2_SCOPE: ${GAMJA_OAUTH2_SCOPE:-}
    networks:
      - irc
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "0.5"
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      gamja:
        condition: service_healthy
    environment:
      GAMJA_DOMAIN: ${GAMJA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - irc
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  soju-data:
  caddy-data:
  caddy-config:

networks:
  irc:
