services:
  soju:
    image: ghcr.io/ploos-as/soju:latest
    restart: unless-stopped
    command: ["-config", "/etc/soju/config"]
    volumes:
      - ./soju.conf:/etc/soju/config:ro
      - soju-data:/var/lib/soju
    networks:
      - irc
    security_opt:
      - no-new-privileges:true

  gamja:
    image: ghcr.io/ploos-as/gamja:latest
    restart: unless-stopped
    depends_on:
      - soju
    environment:
      SOJU_HOST: soju
      SOJU_PORT: 8080
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - irc
    security_opt:
      - no-new-privileges:true

volumes:
  soju-data:

networks:
  irc:
