name: release

on:
  workflow_run:
    workflows: [container]
    types: [completed]

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ploos-as/gamja

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve and verify release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/validate-release-tag.sh
          if ! version="$(./scripts/validate-release-tag.sh "$TAG")"; then
            echo "Ignoring invalid or OCI-incompatible release tag: $TAG"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref_json="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          case "$object_type" in
            commit) tag_commit="$object_sha" ;;
            tag)
              tag_json="$(gh api "/repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              tag_commit="$(jq -r 'select(.object.type == "commit") | .object.sha' <<<"$tag_json")"
              ;;
            *) echo "Release ref $TAG does not resolve to a commit" >&2; exit 1 ;;
          esac
          test -n "$tag_commit"
          if [ "$tag_commit" != "$WORKFLOW_COMMIT" ]; then
            echo "Release integrity failure: tag $TAG resolves to $tag_commit, container workflow built $WORKFLOW_COMMIT" >&2
            exit 1
          fi
          image="$REGISTRY/$IMAGE_NAME:$version"
          token="$(curl -fsSL "https://ghcr.io/token?scope=repository:$IMAGE_NAME:pull" | jq -r .token)"
          manifest="$(curl -fsSL -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' "https://ghcr.io/v2/$IMAGE_NAME/manifests/$version")"
          digest="$(curl -fsSI -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' "https://ghcr.io/v2/$IMAGE_NAME/manifests/$version" | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2; exit}')"
          test -n "$digest"
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")' <<<"$manifest" >/dev/null
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' <<<"$manifest" >/dev/null
          image_revision="$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' <<<"$manifest")"
          if [ "$image_revision" != "$WORKFLOW_COMMIT" ]; then
            echo "Release integrity failure: OCI revision '$image_revision' != release commit '$WORKFLOW_COMMIT'" >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "release_commit=$WORKFLOW_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: steps.meta.outputs.eligible == 'true'
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Verify signed release image
        if: steps.meta.outputs.eligible == 'true'
        env:
          DIGEST: ${{ steps.meta.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/Ploos-AS/gamja/.github/workflows/container.yml@refs/tags/v.*$' \
            "ghcr.io/ploos-as/gamja@$DIGEST" >/tmp/release-cosign-verification.json
          jq -e 'length > 0' /tmp/release-cosign-verification.json >/dev/null
          echo 'M1.12 release gate: keyless signature verified for exact release digest.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release SBOM and provenance attestations
        if: steps.meta.outputs.eligible == 'true'
        env:
          DIGEST: ${{ steps.meta.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify-attestations.sh
          ./scripts/verify-attestations.sh "ghcr.io/ploos-as/gamja@$DIGEST"
          echo 'M1.13 release gate: SPDX SBOM and BuildKit SLSA provenance verified for amd64 and arm64.' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate M1.14 release evidence
        if: steps.meta.outputs.eligible == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/create-release-evidence.sh
          ./scripts/create-release-evidence.sh /tmp/release-evidence.json
          (cd /tmp && sha256sum release-evidence.json > release-evidence.json.sha256)
          (cd /tmp && sha256sum -c release-evidence.json.sha256)
          jq -e --arg digest "$DIGEST" --arg commit "$RELEASE_COMMIT" '.digest == $digest and .release_commit == $commit and .verification.signature_verified and .verification.attestations_verified' /tmp/release-evidence.json >/dev/null
          echo 'M1.14 release evidence generated and checksummed for the exact verified OCI digest.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify M1.15 consumer release path
        if: steps.meta.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify-release.sh ./scripts/verify-attestations.sh
          ./scripts/verify-release.sh /tmp/release-evidence.json /tmp/release-evidence.json.sha256
          echo 'M1.15 consumer verifier accepted the exact release evidence and OCI artifact before publication.' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release if missing
        if: steps.meta.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          cat > /tmp/release-notes.md <<EOF
          Ploos-AS container release for Gamja.

          Highlights:
          - non-root nginx runtime on port 8080 with read-only-root-filesystem support
          - runtime-generated Gamja configuration and built-in \`/socket\` WebSocket proxy to soju
          - qualified Docker Compose and rootless Podman Quadlet production deployments
          - qualified HTTPS/WSS reverse-proxy paths and production backup/restore
          - release-blocking HIGH/CRITICAL Trivy security qualification
          - multi-architecture OCI image for \`linux/amd64\` and \`linux/arm64\`
          - SPDX SBOM and BuildKit SLSA provenance (mode=max), verified for both platforms
          - OCI revision annotation verified against the exact release tag commit
          - Cosign keyless signature verified for the exact release digest before GitHub Release creation
          - machine-readable M1.14 release evidence plus SHA-256 checksum attached to this release
          - M1.15 consumer verifier qualified against the same evidence, signature and attestations before publication

          Container image:
          \`$IMAGE\`

          OCI index digest:
          \`$DIGEST\`

          Release commit:
          \`$RELEASE_COMMIT\`
          EOF
          gh release create "$TAG" \
            /tmp/release-evidence.json \
            /tmp/release-evidence.json.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gamja container $TAG" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
