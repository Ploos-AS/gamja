name: release

on:
  workflow_run:
    workflows: [container]
    types: [completed]

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ploos-as/gamja

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve and verify release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./scripts/validate-release-tag.sh
          if ! version="$(./scripts/validate-release-tag.sh "$TAG")"; then
            echo "Ignoring invalid or OCI-incompatible release tag: $TAG"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve both lightweight and annotated tags to the commit they name.
          ref_json="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          case "$object_type" in
            commit)
              tag_commit="$object_sha"
              ;;
            tag)
              tag_json="$(gh api "/repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              tag_commit="$(jq -r 'select(.object.type == "commit") | .object.sha' <<<"$tag_json")"
              ;;
            *)
              echo "Release ref $TAG does not resolve to a commit" >&2
              exit 1
              ;;
          esac

          test -n "$tag_commit"
          if [ "$tag_commit" != "$WORKFLOW_COMMIT" ]; then
            echo "Release integrity failure: tag $TAG resolves to $tag_commit, container workflow built $WORKFLOW_COMMIT" >&2
            exit 1
          fi

          image="$REGISTRY/$IMAGE_NAME:$version"

          token="$(curl -fsSL "https://ghcr.io/token?scope=repository:$IMAGE_NAME:pull" | jq -r .token)"
          manifest="$(curl -fsSL \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/$IMAGE_NAME/manifests/$version")"
          digest="$(curl -fsSI \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/$IMAGE_NAME/manifests/$version" \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2; exit}')"

          test -n "$digest"
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")' <<<"$manifest" >/dev/null
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' <<<"$manifest" >/dev/null
          image_revision="$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' <<<"$manifest")"
          if [ "$image_revision" != "$WORKFLOW_COMMIT" ]; then
            echo "Release integrity failure: OCI revision '$image_revision' != release commit '$WORKFLOW_COMMIT'" >&2
            exit 1
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "release_commit=$WORKFLOW_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release if missing
        if: steps.meta.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          cat > /tmp/release-notes.md <<EOF
          Ploos-AS container release for Gamja.

          Highlights:
          - non-root nginx runtime on port 8080 with read-only-root-filesystem support
          - runtime-generated Gamja configuration and built-in \`/socket\` WebSocket proxy to soju
          - qualified Docker Compose and rootless Podman Quadlet production deployments
          - qualified HTTPS/WSS reverse-proxy paths and production backup/restore
          - release-blocking HIGH/CRITICAL Trivy security qualification
          - multi-architecture OCI image for \`linux/amd64\` and \`linux/arm64\`
          - SBOM and BuildKit provenance (mode=max)
          - OCI revision annotation verified against the exact release tag commit

          Container image:
          \`$IMAGE\`

          OCI index digest:
          \`$DIGEST\`

          Release commit:
          \`$RELEASE_COMMIT\`
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gamja container $TAG" \
            --notes-file /tmp/release-notes.md \
            --verify-tag