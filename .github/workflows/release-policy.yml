name: release-policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Qualify strict release tags
        run: |
          set -euo pipefail
          chmod +x ./scripts/validate-release-tag.sh
          valid=(v0.2.0 v1.0.0 v10.20.30 v1.2.3-rc.1 v1.2.3-alpha.beta)
          invalid=(1.2.3 v1.2 v1.2.3+build.1 v01.2.3 v1.02.3 v1.2.03 v1.2.3-01 v1.2.3- v1.2.3-rc..1)
          for tag in "${valid[@]}"; do test "$(./scripts/validate-release-tag.sh "$tag")" = "${tag#v}"; done
          for tag in "${invalid[@]}"; do ! ./scripts/validate-release-tag.sh "$tag" >/dev/null 2>&1; done

      - name: Verify release integrity, signature and attestation wiring
        run: |
          set -euo pipefail
          grep -Fq 'scripts/validate-release-tag.sh' .github/workflows/release.yml
          grep -Fq 'workflow_run.head_sha' .github/workflows/release.yml
          grep -Fq 'org.opencontainers.image.revision' .github/workflows/release.yml
          grep -Fq 'org.opencontainers.image.revision' .github/workflows/container.yml
          grep -Fq 'sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62' .github/workflows/release.yml
          grep -Fq -- '--certificate-oidc-issuer https://token.actions.githubusercontent.com' .github/workflows/release.yml
          grep -Fq 'container.yml@refs/tags/v.*' .github/workflows/release.yml
          grep -Fq 'scripts/verify-attestations.sh' .github/workflows/release.yml
          grep -Fq 'SPDXRef-DOCUMENT' scripts/verify-attestations.sh
          grep -Fq 'linux/amd64 linux/arm64' scripts/verify-attestations.sh

      - name: Qualify M1.18 runtime-bound release evidence
        run: |
          set -euo pipefail
          chmod +x ./scripts/create-release-evidence.sh ./scripts/verify-release.sh
          export TAG=v1.2.3 VERSION=1.2.3 IMAGE=ghcr.io/ploos-as/gamja:1.2.3
          export DIGEST=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export RELEASE_COMMIT=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          ./scripts/create-release-evidence.sh /tmp/evidence-a.json
          ./scripts/create-release-evidence.sh /tmp/evidence-b.json
          cmp /tmp/evidence-a.json /tmp/evidence-b.json
          jq -e '.runtime.platforms == ["linux/amd64","linux/arm64"] and .runtime.immutable_digest and .runtime.uid == 101 and .runtime.read_only_rootfs and .runtime.no_new_privileges and .runtime.healthy and .runtime.generated_config_verified and .runtime.websocket_upgrade_verified and .verification.runtime_verified' /tmp/evidence-a.json >/dev/null
          (cd /tmp && sha256sum evidence-a.json > evidence-a.json.sha256)
          ./scripts/verify-release.sh --metadata-only /tmp/evidence-a.json /tmp/evidence-a.json.sha256

          cp /tmp/evidence-a.json /tmp/tampered.json
          jq '.verification.runtime_verified = false' /tmp/tampered.json > /tmp/tampered.new
          mv /tmp/tampered.new /tmp/tampered.json
          (cd /tmp && sha256sum tampered.json > tampered.json.sha256)
          if ./scripts/verify-release.sh --metadata-only /tmp/tampered.json /tmp/tampered.json.sha256 >/dev/null 2>&1; then
            echo 'consumer verifier accepted false runtime qualification' >&2
            exit 1
          fi

      - name: Qualify M1.19 keyless evidence signing policy
        run: |
          set -euo pipefail
          jq -e '.evidence_signature.scheme == "cosign-keyless-blob" and .evidence_signature.oidc_issuer == "https://token.actions.githubusercontent.com" and .evidence_signature.workflow_identity == "https://github.com/Ploos-AS/gamja/.github/workflows/release.yml@refs/heads/main"' /tmp/evidence-a.json >/dev/null
          grep -Fq 'id-token: write' .github/workflows/release.yml
          grep -Fq 'cosign sign-blob' .github/workflows/release.yml
          grep -Fq -- '--bundle /tmp/release-evidence.bundle.json' .github/workflows/release.yml
          grep -Fq 'cosign verify-blob' .github/workflows/release.yml
          grep -Fq 'release.yml@refs/heads/main' .github/workflows/release.yml
          grep -Fq 'cosign verify-blob' scripts/verify-release.sh
          grep -Fq 'signed evidence bundle is required for full verification' scripts/verify-release.sh
          grep -Fq 'release-evidence.bundle.json' .github/workflows/release-verification.yml
          grep -Fq '/tmp/release-evidence.bundle.json' .github/workflows/release.yml

          if ./scripts/verify-release.sh /tmp/evidence-a.json /tmp/evidence-a.json.sha256 >/dev/null 2>&1; then
            echo 'full consumer verification accepted unsigned evidence without a bundle' >&2
            exit 1
          fi

          runtime_line=$(grep -n 'Qualify M1.17 exact release runtime on amd64 and arm64' .github/workflows/release.yml | cut -d: -f1)
          evidence_line=$(grep -n 'Generate M1.18 runtime-bound release evidence' .github/workflows/release.yml | cut -d: -f1)
          signing_line=$(grep -n 'Sign and verify M1.19 release evidence' .github/workflows/release.yml | cut -d: -f1)
          consumer_line=$(grep -n 'Verify M1.19 consumer release path' .github/workflows/release.yml | cut -d: -f1)
          release_line=$(grep -n 'Create GitHub release if missing' .github/workflows/release.yml | cut -d: -f1)
          test "$runtime_line" -lt "$evidence_line"
          test "$evidence_line" -lt "$signing_line"
          test "$signing_line" -lt "$consumer_line"
          test "$consumer_line" -lt "$release_line"

      - name: Qualify M1.20 post-release audit policy
        run: |
          set -euo pipefail
          bash -n ./scripts/audit-release.sh
          chmod +x ./scripts/audit-release.sh
          mkdir -p /tmp/m120-fixtures /tmp/m120-bin
          cp /tmp/evidence-a.json /tmp/m120-fixtures/release-evidence.json
          cp /tmp/evidence-a.json.sha256 /tmp/m120-fixtures/release-evidence.json.sha256
          printf '{}\n' > /tmp/m120-fixtures/release-evidence.bundle.json

          cat > /tmp/m120-bin/git <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = rev-parse ]; then
            printf '%s\n' "${M120_GIT_COMMIT:-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}"
            exit 0
          fi
          exit 2
          EOF

          cat > /tmp/m120-bin/gh <<'EOF'
          #!/bin/sh
          set -eu
          if [ "${1:-}" = release ] && [ "${2:-}" = view ]; then
            if [ "${M120_EXTRA_ASSET:-0}" = 1 ]; then
              printf '%s\n' '{"tagName":"v1.2.3","isDraft":false,"assets":[{"name":"release-evidence.bundle.json","size":3},{"name":"release-evidence.json","size":1},{"name":"release-evidence.json.sha256","size":1},{"name":"unexpected.bin","size":1}]}'
            else
              printf '%s\n' '{"tagName":"v1.2.3","isDraft":false,"assets":[{"name":"release-evidence.bundle.json","size":3},{"name":"release-evidence.json","size":1},{"name":"release-evidence.json.sha256","size":1}]}'
            fi
            exit 0
          fi
          if [ "${1:-}" = release ] && [ "${2:-}" = download ]; then
            dir=''
            while [ "$#" -gt 0 ]; do
              if [ "$1" = --dir ]; then shift; dir=$1; fi
              shift || true
            done
            test -n "$dir"
            cp /tmp/m120-fixtures/release-evidence.json "$dir/"
            cp /tmp/m120-fixtures/release-evidence.json.sha256 "$dir/"
            cp /tmp/m120-fixtures/release-evidence.bundle.json "$dir/"
            exit 0
          fi
          exit 2
          EOF
          chmod +x /tmp/m120-bin/git /tmp/m120-bin/gh

          PATH="/tmp/m120-bin:$PATH" GITHUB_REPOSITORY=Ploos-AS/gamja ./scripts/audit-release.sh --metadata-only v1.2.3
          ! PATH="/tmp/m120-bin:$PATH" M120_EXTRA_ASSET=1 GITHUB_REPOSITORY=Ploos-AS/gamja ./scripts/audit-release.sh --metadata-only v1.2.3 >/dev/null 2>&1
          ! PATH="/tmp/m120-bin:$PATH" M120_GIT_COMMIT=cccccccccccccccccccccccccccccccccccccccc GITHUB_REPOSITORY=Ploos-AS/gamja ./scripts/audit-release.sh --metadata-only v1.2.3 >/dev/null 2>&1

          grep -Fq "cron: '17 6 * * 1'" .github/workflows/release-verification.yml
          grep -Fq './scripts/audit-release.sh "$TAG"' .github/workflows/release-verification.yml
          grep -Fq 'fetch-depth: 0' .github/workflows/release-verification.yml
          grep -Fq 'release-evidence.bundle.json' scripts/audit-release.sh
          grep -Fq '(.size // 0) > 0' scripts/audit-release.sh

      - name: Qualify M1.16 and M1.17 digest-bound runtime gate
        run: |
          set -euo pipefail
          bash -n ./scripts/qualify-release-runtime.sh
          chmod +x ./scripts/qualify-release-runtime.sh
          ! ./scripts/qualify-release-runtime.sh ghcr.io/ploos-as/gamja:latest linux/amd64 >/dev/null 2>&1
          ! ./scripts/qualify-release-runtime.sh ghcr.io/ploos-as/gamja@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa linux/s390x >/dev/null 2>&1
          grep -Fq 'linux/amd64|linux/arm64' scripts/qualify-release-runtime.sh
          grep -Fq -- '--platform "$platform"' scripts/qualify-release-runtime.sh
          grep -Fq -- '--read-only' scripts/qualify-release-runtime.sh
          grep -Fq -- '--security-opt no-new-privileges:true' scripts/qualify-release-runtime.sh
          grep -Fq 'Sec-WebSocket-Version: 13' scripts/qualify-release-runtime.sh
          qemu_pin='docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a'
          binfmt_pin='docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0'
          grep -Fq "$qemu_pin" .github/workflows/release-runtime.yml
          grep -Fq "$binfmt_pin" .github/workflows/release-runtime.yml
          grep -Fq "$qemu_pin" .github/workflows/release.yml
          grep -Fq "$binfmt_pin" .github/workflows/release.yml
          grep -Fq './scripts/qualify-release-runtime.sh "ghcr.io/ploos-as/gamja@$DIGEST" linux/amd64' .github/workflows/release.yml
          grep -Fq './scripts/qualify-release-runtime.sh "ghcr.io/ploos-as/gamja@$DIGEST" linux/arm64' .github/workflows/release.yml

      - name: Verify published consumer path remains wired
        run: |
          set -euo pipefail
          grep -Fq 'release:' .github/workflows/release-verification.yml
          grep -Fq 'types: [published]' .github/workflows/release-verification.yml
          grep -Fq 'release-evidence.json.sha256' .github/workflows/release-verification.yml
          grep -Fq 'release-evidence.bundle.json' .github/workflows/release-verification.yml
          grep -Fq './scripts/audit-release.sh' .github/workflows/release-verification.yml

      - name: Record release policy
        run: |
          {
            echo '### M1.20 release integrity qualification'
            echo
            echo '- M1.19 keyless signed evidence remains mandatory before publication'
            echo '- M1.20 audits the GitHub Release object after publication and on a weekly schedule'
            echo '- audit requires a non-draft release and the exact three signed-evidence assets, all non-empty'
            echo '- Git tag commit must equal the commit recorded in release evidence'
            echo '- full audit reuses the canonical M1.19 consumer verifier for evidence signature, OCI signature and attestations'
            echo '- deterministic policy tests reject unexpected assets and tag/evidence commit mismatches'
            echo '- legacy releases without M1.20 signed evidence are not silently classified as compliant'
          } >> "$GITHUB_STEP_SUMMARY"
