name: release-policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Qualify strict release tags
        shell: bash
        run: |
          set -euo pipefail
          validator=./scripts/validate-release-tag.sh
          chmod +x "$validator"
          valid=(v0.2.0 v1.0.0 v10.20.30 v1.2.3-rc.1 v1.2.3-alpha.beta)
          invalid=(1.2.3 v1.2 v1.2.3+build.1 v01.2.3 v1.02.3 v1.2.03 v1.2.3-01 v1.2.3- v1.2.3-rc..1)
          for tag in "${valid[@]}"; do version="$($validator "$tag")"; test "$version" = "${tag#v}"; done
          for tag in "${invalid[@]}"; do
            if "$validator" "$tag" >/dev/null 2>&1; then echo "validator incorrectly accepted $tag" >&2; exit 1; fi
          done

      - name: Verify release integrity wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'scripts/validate-release-tag.sh' .github/workflows/release.yml
          grep -Fq 'tag_commit' .github/workflows/release.yml
          grep -Fq 'workflow_run.head_sha' .github/workflows/release.yml
          grep -Fq 'org.opencontainers.image.revision' .github/workflows/release.yml
          grep -Fq 'org.opencontainers.image.revision' .github/workflows/container.yml

      - name: Verify signed release gate wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62' .github/workflows/release.yml
          grep -Fq 'Verify signed release image' .github/workflows/release.yml
          grep -Fq -- '--certificate-oidc-issuer https://token.actions.githubusercontent.com' .github/workflows/release.yml
          grep -Fq "container.yml@refs/tags/v.*" .github/workflows/release.yml
          verify_line=$(grep -n 'Verify signed release image' .github/workflows/release.yml | cut -d: -f1)
          release_line=$(grep -n 'Create GitHub release if missing' .github/workflows/release.yml | cut -d: -f1)
          test "$verify_line" -lt "$release_line"

      - name: Verify attestation release gate wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'scripts/verify-attestations.sh' .github/workflows/release.yml
          grep -Fq 'Verify release SBOM and provenance attestations' .github/workflows/release.yml
          grep -Fq 'SPDXRef-DOCUMENT' scripts/verify-attestations.sh
          grep -Fq 'https://mobyproject.org/buildkit@v1' scripts/verify-attestations.sh
          grep -Fq 'linux/amd64 linux/arm64' scripts/verify-attestations.sh
          attest_line=$(grep -n 'Verify release SBOM and provenance attestations' .github/workflows/release.yml | cut -d: -f1)
          release_line=$(grep -n 'Create GitHub release if missing' .github/workflows/release.yml | cut -d: -f1)
          test "$attest_line" -lt "$release_line"

      - name: Record release policy
        run: |
          {
            echo "### M1.8 + M1.12 + M1.13 release integrity qualification"
            echo
            echo "- strict OCI-compatible SemVer release tags"
            echo "- annotated/lightweight tag commit must equal successful container workflow commit"
            echo "- OCI revision must equal release commit"
            echo "- exact OCI release digest must have a valid Cosign keyless signature"
            echo "- signature identity is restricted to this repository's container workflow on a version tag"
            echo "- SPDX SBOM and BuildKit SLSA provenance must validate for amd64 and arm64"
            echo "- GitHub Release creation occurs only after signature and attestation verification"
          } >> "$GITHUB_STEP_SUMMARY"
