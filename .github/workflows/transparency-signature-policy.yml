name: transparency-signature-policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: transparency-signature-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Create canonical M1.25 snapshot fixture
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/create-release-index.sh scripts/verify-release-index.sh scripts/verify-transparency-snapshot.sh
          root=$(mktemp -d)
          mkdir -p "$root/v1.2.3"
          dir="$root/v1.2.3"
          jq -n '{tag:"v1.2.3",release_commit:"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",image:"ghcr.io/ploos-as/gamja",digest:"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' > "$dir/release-evidence.json"
          (cd "$dir" && sha256sum release-evidence.json > release-evidence.json.sha256)
          printf '%s\n' '{"fixture":"evidence-bundle"}' > "$dir/release-evidence.bundle.json"
          jq -n '{release:{tag:"v1.2.3",commit:"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},image:{name:"ghcr.io/ploos-as/gamja",digest:"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}}' > "$dir/release-audit.json"
          (cd "$dir" && sha256sum release-audit.json > release-audit.json.sha256)
          printf '%s\n' '{"fixture":"audit-bundle"}' > "$dir/release-audit.bundle.json"
          scripts/create-release-index.sh "$root" /tmp/release-index.json
          (cd /tmp && sha256sum release-index.json > release-index.json.sha256)
          scripts/verify-release-index.sh /tmp/release-index.json "$root"
          echo "root=$root" >> "$GITHUB_ENV"

      - name: Keylessly sign exact M1.26 fixture bytes
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle /tmp/release-index.bundle.json \
            /tmp/release-index.json >/dev/null
          test -s /tmp/release-index.bundle.json

      - name: Verify expected policy workflow identity
        env:
          TRANSPARENCY_IDENTITY: https://github.com/Ploos-AS/gamja/.github/workflows/transparency-signature-policy.yml@refs/heads/main
        run: |
          set -euo pipefail
          scripts/verify-transparency-snapshot.sh \
            /tmp/release-index.json \
            /tmp/release-index.json.sha256 \
            /tmp/release-index.bundle.json \
            "$root"

      - name: Reject wrong workflow identity
        env:
          TRANSPARENCY_IDENTITY: https://github.com/Ploos-AS/gamja/.github/workflows/release-transparency.yml@refs/heads/main
        run: |
          set -euo pipefail
          if scripts/verify-transparency-snapshot.sh \
            /tmp/release-index.json \
            /tmp/release-index.json.sha256 \
            /tmp/release-index.bundle.json \
            "$root" >/dev/null 2>&1; then
            echo 'M1.26 accepted a bundle signed by the wrong workflow identity' >&2
            exit 1
          fi

      - name: Reject wrong OIDC issuer
        env:
          TRANSPARENCY_IDENTITY: https://github.com/Ploos-AS/gamja/.github/workflows/transparency-signature-policy.yml@refs/heads/main
          TRANSPARENCY_OIDC_ISSUER: https://issuer.invalid.example
        run: |
          set -euo pipefail
          if scripts/verify-transparency-snapshot.sh \
            /tmp/release-index.json \
            /tmp/release-index.json.sha256 \
            /tmp/release-index.bundle.json \
            "$root" >/dev/null 2>&1; then
            echo 'M1.26 accepted an unexpected OIDC issuer' >&2
            exit 1
          fi

      - name: Reject tampered signed bytes after rechecksumming
        env:
          TRANSPARENCY_IDENTITY: https://github.com/Ploos-AS/gamja/.github/workflows/transparency-signature-policy.yml@refs/heads/main
        run: |
          set -euo pipefail
          cp /tmp/release-index.json /tmp/release-index.original.json
          jq '.milestone = "M9.99"' /tmp/release-index.original.json > /tmp/release-index.json
          (cd /tmp && sha256sum release-index.json > release-index.json.sha256)
          if scripts/verify-transparency-snapshot.sh \
            /tmp/release-index.json \
            /tmp/release-index.json.sha256 \
            /tmp/release-index.bundle.json >/dev/null 2>&1; then
            echo 'M1.26 accepted rechecksummed bytes not covered by the original signature' >&2
            exit 1
          fi

      - name: Verify production M1.26 wiring
        run: |
          set -euo pipefail
          grep -Fq 'id-token: write' .github/workflows/release-transparency.yml
          grep -Fq 'cosign sign-blob --yes' .github/workflows/release-transparency.yml
          grep -Fq 'release-index.bundle.json' .github/workflows/release-transparency.yml
          grep -Fq 'verify-transparency-snapshot.sh' .github/workflows/release-transparency.yml
          grep -Fq 'release-transparency.yml@refs/heads/main' scripts/verify-transparency-snapshot.sh
          grep -Fq 'M1.26' RELEASE-TRANSPARENCY.md

      - name: Record M1.26 policy
        run: |
          {
            echo '### M1.26 signed transparency snapshot qualification'
            echo
            echo '- exact deterministic release-index.json bytes are keylessly signed with GitHub Actions OIDC'
            echo '- canonical consumer verifies checksum, M1.25 schema and Sigstore bundle'
            echo '- expected workflow identity and GitHub Actions OIDC issuer are enforced'
            echo '- rechecksummed tampered bytes are rejected by the original signature'
            echo '- production signatures are restricted to refs/heads/main'
          } >> "$GITHUB_STEP_SUMMARY"
