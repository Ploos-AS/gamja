name: dependencies

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Verify pinned OCI dependencies are reachable
        run: |
          set -eu
          refs='node:22.23.2-alpine3.24@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
          nginxinc/nginx-unprivileged:1.30-alpine3.24@sha256:9b87ad3dd9f431c733f19dfb278c7eb3dba9dca381942c79818bb42f1a566a83
          ghcr.io/ploos-as/soju:latest@sha256:ae1eb58d75beea7bfbeff3f004700289f2fcd4c56da671d88216f2cfb2d1d491
          caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8'
          printf '%s\n' "$refs" | while IFS= read -r ref; do
            test -n "$ref" || continue
            echo "checking $ref"
            docker buildx imagetools inspect "$ref" >/dev/null
          done

      - name: Report mutable-tag drift
        shell: bash
        run: |
          set -euo pipefail
          check_tag() {
            name=$1
            tag=$2
            pinned=$3
            current=$(docker buildx imagetools inspect "$tag" | awk '/^Digest:/ {print $2; exit}')
            test -n "$current"
            if [[ "$current" == "$pinned" ]]; then status=current; else status=update-available; fi
            printf '%s tag=%s pinned=%s current=%s status=%s\n' "$name" "$tag" "$pinned" "$current" "$status" | tee -a /tmp/dependency-drift.txt
          }
          check_tag node node:22.23.2-alpine3.24 sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
          check_tag nginx nginxinc/nginx-unprivileged:1.30-alpine3.24 sha256:9b87ad3dd9f431c733f19dfb278c7eb3dba9dca381942c79818bb42f1a566a83
          check_tag soju ghcr.io/ploos-as/soju:latest sha256:ae1eb58d75beea7bfbeff3f004700289f2fcd4c56da671d88216f2cfb2d1d491
          check_tag caddy caddy:2.11.4-alpine sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648

      - name: Verify pinned GitHub Action commits exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          check_commit() {
            repo=$1
            sha=$2
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$repo/commits/$sha" >/dev/null
          }
          check_commit actions/checkout fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
          check_commit docker/setup-qemu-action 1f40c72289eff860ee54a304f1438e3cff362e0a
          check_commit docker/setup-buildx-action 37fe631027851001ddb9b187196cc803df7f5f0e
          check_commit docker/build-push-action 53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
          check_commit docker/login-action dbcb813823bdd20940b903addbd779551569679f
          check_commit docker/metadata-action dc802804100637a589fabce1cb79ff13a1411302
          check_commit aquasecurity/trivy-action ed142fd0673e97e23eac54620cfb913e5ce36c25

      - name: Verify dependency pins remain wired into repository
        run: |
          set -eu
          grep -Fq 'node:22.23.2-alpine3.24@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32' Dockerfile
          grep -Fq 'nginxinc/nginx-unprivileged:1.30-alpine3.24@sha256:9b87ad3dd9f431c733f19dfb278c7eb3dba9dca381942c79818bb42f1a566a83' Dockerfile
          grep -Fq 'ghcr.io/ploos-as/soju:latest@sha256:ae1eb58d75beea7bfbeff3f004700289f2fcd4c56da671d88216f2cfb2d1d491' examples/production/compose.yaml
          grep -Fq 'caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648' examples/production/compose.yaml

      - name: Record M1.10 dependency status
        if: always()
        run: |
          {
            echo '### M1.10 dependency qualification'
            echo
            echo '- Immutable OCI pins are required to remain fetchable.'
            echo '- Mutable tag drift is informational and never changes production pins automatically.'
            echo '- Pinned GitHub Action commits must remain resolvable.'
            if [ -f /tmp/dependency-drift.txt ]; then
              echo
              echo '```text'
              cat /tmp/dependency-drift.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
