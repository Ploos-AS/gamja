name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gamja:smoke
          cache-from: type=gha

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name gamja-smoke \
            -p 18080:8080 \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /var/cache/nginx \
            --tmpfs /var/run \
            --security-opt no-new-privileges:true \
            gamja:smoke
          trap 'docker logs gamja-smoke || true; docker rm -f gamja-smoke || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/tmp/gamja-index.html; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/config.json >/tmp/gamja-config.json
          grep -q '<title>gamja</title>' /tmp/gamja-index.html
          grep -q '"url": "/socket"' /tmp/gamja-config.json

          for i in {1..30}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' gamja-smoke)"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$health" = unhealthy ]; then
              docker logs gamja-smoke
              exit 1
            fi
            sleep 1
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' gamja-smoke)" = healthy
          test "$(docker inspect --format '{{.Config.User}}' gamja-smoke)" != ""
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' gamja-smoke)" = true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ploos-as/gamja
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and optionally push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
