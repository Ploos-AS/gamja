name: release-v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.1.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
          IMAGE: ghcr.io/ploos-as/gamja:0.1.0
          DIGEST: sha256:a33e442c69674466deaf2abd805746b855e9e36767273d00ec6762780859c3fb
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          cat > /tmp/release-notes.md <<EOF
          First Ploos-AS container release for Gamja.

          Highlights:
          - reproducible build pinned to upstream Gamja commit \`0f273b96994fb32b3a1b868d4b59229285f3455c\`
          - non-root nginx runtime on port 8080
          - read-only-root-filesystem friendly runtime
          - built-in \`/socket\` WebSocket proxy to soju
          - runtime-configurable \`SOJU_HOST\` and \`SOJU_PORT\`
          - Docker Compose and rootless Podman Quadlet examples
          - verified Gamja -> nginx -> soju WebSocket upgrade
          - multi-architecture OCI image for \`linux/amd64\` and \`linux/arm64\`
          - SBOM and BuildKit provenance (mode=max)

          Container image:
          \`$IMAGE\`

          OCI index digest:
          \`$DIGEST\`

          Aliases published from this release:
          - \`ghcr.io/ploos-as/gamja:0.1\`
          - \`ghcr.io/ploos-as/gamja:0\`
          - \`ghcr.io/ploos-as/gamja:latest\`

          Release commit:
          \`b31f2e5fa8bc96043881b7f6f4ffb51075e63c64\`
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gamja container v0.1.0" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
