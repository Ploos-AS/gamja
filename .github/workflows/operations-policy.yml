name: operations-policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Render production Compose model
        run: |
          set -euo pipefail
          GAMJA_DOMAIN=example.invalid docker compose -f examples/production/compose.yaml config --format json >/tmp/m16-compose.json
          jq -e . /tmp/m16-compose.json >/dev/null

      - name: Verify resource guardrails and log rotation
        run: |
          set -euo pipefail
          jq -e '(.services.soju.cpus|tonumber) == 1 and (.services.soju.mem_limit|tonumber) == 268435456 and (.services.soju.pids_limit|tonumber) == 256' /tmp/m16-compose.json
          jq -e '(.services.gamja.cpus|tonumber) == 0.5 and (.services.gamja.mem_limit|tonumber) == 134217728 and (.services.gamja.pids_limit|tonumber) == 128' /tmp/m16-compose.json
          jq -e '(.services.caddy.cpus|tonumber) == 1 and (.services.caddy.mem_limit|tonumber) == 268435456 and (.services.caddy.pids_limit|tonumber) == 256' /tmp/m16-compose.json
          for service in soju gamja caddy; do
            jq -e --arg service "$service" '.services[$service].logging.driver == "json-file"' /tmp/m16-compose.json
            jq -e --arg service "$service" '(.services[$service].logging.options["max-size"]|tostring) == "10m"' /tmp/m16-compose.json
            jq -e --arg service "$service" '(.services[$service].logging.options["max-file"]|tostring) == "3"' /tmp/m16-compose.json
          done

      - name: Verify shutdown policy and operational docs
        run: |
          set -euo pipefail
          jq -e '(.services.soju.stop_grace_period|tostring) == "30s" or (.services.soju.stop_grace_period|tonumber) == 30000000000' /tmp/m16-compose.json
          jq -e '(.services.gamja.stop_grace_period|tostring) == "15s" or (.services.gamja.stop_grace_period|tonumber) == 15000000000' /tmp/m16-compose.json
          jq -e '(.services.caddy.stop_grace_period|tostring) == "30s" or (.services.caddy.stop_grace_period|tonumber) == 30000000000' /tmp/m16-compose.json
          test -s examples/production/OPERATIONS.md
          grep -q 'docker compose logs -f' examples/production/OPERATIONS.md
          grep -q 'docker stats' examples/production/OPERATIONS.md
          grep -q 'docker compose pull' examples/production/OPERATIONS.md
