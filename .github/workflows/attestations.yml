name: attestations

on:
  workflow_run:
    workflows: [container]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "11 6 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: attestations-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4, Node 24
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Resolve latest digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect ghcr.io/ploos-as/gamja:latest | awk '/^Digest:/ {print $2; exit}')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify published SBOM and provenance attestations
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          chmod +x ./scripts/verify-attestations.sh
          ./scripts/verify-attestations.sh "ghcr.io/ploos-as/gamja@$DIGEST"

      - name: Record M1.13 attestation status
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo '### M1.13 attestation qualification'
            echo
            echo "Digest: \`$DIGEST\`"
            echo '- linux/amd64 SPDX SBOM verified'
            echo '- linux/amd64 BuildKit SLSA provenance verified'
            echo '- linux/arm64 SPDX SBOM verified'
            echo '- linux/arm64 BuildKit SLSA provenance verified'
          } >> "$GITHUB_STEP_SUMMARY"
