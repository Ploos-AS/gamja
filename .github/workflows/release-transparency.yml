name: release-transparency

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'
  workflow_run:
    workflows: ["release-verification"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  qualify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Install Cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Qualify deterministic M1.25 transparency policy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/create-release-index.sh scripts/verify-release-index.sh scripts/collect-release-index.sh scripts/verify-transparency-snapshot.sh
          sh -n scripts/create-release-index.sh
          sh -n scripts/verify-release-index.sh
          sh -n scripts/collect-release-index.sh
          sh -n scripts/verify-transparency-snapshot.sh

          root="$(mktemp -d)"
          trap 'rm -rf "$root" /tmp/m125-*.json' EXIT

          make_release() {
            local tag=$1 commit=$2 digest=$3
            local dir="$root/$tag"
            mkdir -p "$dir"

            jq -n \
              --arg tag "$tag" \
              --arg commit "$commit" \
              --arg digest "$digest" \
              '{tag:$tag,release_commit:$commit,image:"ghcr.io/ploos-as/gamja",digest:$digest}' \
              > "$dir/release-evidence.json"
            (cd "$dir" && sha256sum release-evidence.json > release-evidence.json.sha256)
            printf '%s\n' '{"fixture":"evidence-bundle"}' > "$dir/release-evidence.bundle.json"

            jq -n \
              --arg tag "$tag" \
              --arg commit "$commit" \
              --arg digest "$digest" \
              '{release:{tag:$tag,commit:$commit},image:{name:"ghcr.io/ploos-as/gamja",digest:$digest}}' \
              > "$dir/release-audit.json"
            (cd "$dir" && sha256sum release-audit.json > release-audit.json.sha256)
            printf '%s\n' '{"fixture":"audit-bundle"}' > "$dir/release-audit.bundle.json"
          }

          make_release v1.0.1 1111111111111111111111111111111111111111 sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          make_release v1.0.0 0000000000000000000000000000000000000000 sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

          scripts/create-release-index.sh "$root" /tmp/m125-index.json
          scripts/verify-release-index.sh /tmp/m125-index.json "$root"
          jq -e '.releases | map(.tag) == ["v1.0.0","v1.0.1"]' /tmp/m125-index.json >/dev/null
          jq -e 'all(.releases[]; ([.evidence.json.sha256,.evidence.checksum.sha256,.evidence.bundle.sha256,.audit.json.sha256,.audit.checksum.sha256,.audit.bundle.sha256] | all(test("^[0-9a-f]{64}$"))))' /tmp/m125-index.json >/dev/null

          jq '.releases[0].digest="sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"' /tmp/m125-index.json > /tmp/m125-tampered.json
          if scripts/verify-release-index.sh /tmp/m125-tampered.json "$root" >/dev/null 2>&1; then
            echo 'tampered digest unexpectedly accepted' >&2
            exit 1
          fi

          printf '%s\n' '{"drift":true}' >> "$root/v1.0.0/release-audit.bundle.json"
          if scripts/verify-release-index.sh /tmp/m125-index.json "$root" >/dev/null 2>&1; then
            echo 'tampered release asset unexpectedly accepted' >&2
            exit 1
          fi
          printf '%s\n' '{"fixture":"audit-bundle"}' > "$root/v1.0.0/release-audit.bundle.json"

          rm "$root/v1.0.1/release-audit.bundle.json"
          if scripts/create-release-index.sh "$root" /tmp/m125-partial.json >/dev/null 2>&1; then
            echo 'partial M1.24 release state unexpectedly accepted' >&2
            exit 1
          fi

          empty="$(mktemp -d)"
          scripts/create-release-index.sh "$empty" /tmp/m125-empty.json
          scripts/verify-release-index.sh /tmp/m125-empty.json "$empty"
          jq -e '.releases == []' /tmp/m125-empty.json >/dev/null
          rm -rf "$empty"

      - name: Build and verify live M1.25 release transparency index
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/collect-release-index.sh /tmp/release-index.json
          (cd /tmp && sha256sum release-index.json > release-index.json.sha256)
          jq -e '.schema == "https://github.com/Ploos-AS/gamja/releases/transparency-index/v1" and .milestone == "M1.25"' /tmp/release-index.json >/dev/null

      - name: Keylessly sign exact M1.26 transparency snapshot bytes
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle /tmp/release-index.bundle.json \
            /tmp/release-index.json >/dev/null
          test -s /tmp/release-index.bundle.json

      - name: Verify signed M1.26 transparency snapshot
        if: github.ref == 'refs/heads/main'
        env:
          TRANSPARENCY_IDENTITY: https://github.com/Ploos-AS/gamja/.github/workflows/release-transparency.yml@refs/heads/main
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-transparency-snapshot.sh \
            /tmp/release-index.json \
            /tmp/release-index.json.sha256 \
            /tmp/release-index.bundle.json

      - name: Archive M1.26 signed reconstructed transparency snapshot
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: release-transparency-${{ github.run_id }}
          path: |
            /tmp/release-index.json
            /tmp/release-index.json.sha256
            /tmp/release-index.bundle.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record M1.26 qualification
        shell: bash
        run: |
          count=$(jq '.releases | length' /tmp/release-index.json)
          {
            echo '### M1.26 signed release transparency snapshot'
            echo
            echo "- indexed durable M1.24 releases: $count"
            echo '- index remains deterministic, reconstructable and ordered bytewise by release tag'
            echo '- every entry binds tag, release commit, image, immutable OCI digest and all six durable release assets'
            if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
              echo '- exact release-index.json bytes are keylessly signed with GitHub Actions OIDC'
              echo '- canonical consumer verifies checksum, M1.25 schema and release-transparency.yml identity'
              echo '- signed JSON, checksum and Sigstore bundle are archived together'
            else
              echo '- pull-request qualification validates deterministic M1.25/M1.26 wiring without issuing a production snapshot signature'
            fi
            echo '- the signed snapshot is still a reconstructable view; GitHub Release assets remain authoritative'
          } >> "$GITHUB_STEP_SUMMARY"
