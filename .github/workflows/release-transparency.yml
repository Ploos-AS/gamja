name: release-transparency

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Qualify deterministic M1.25 transparency policy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/create-release-index.sh scripts/verify-release-index.sh scripts/collect-release-index.sh
          sh -n scripts/create-release-index.sh
          sh -n scripts/verify-release-index.sh
          sh -n scripts/collect-release-index.sh

          root="$(mktemp -d)"
          trap 'rm -rf "$root" /tmp/m125-*.json' EXIT

          make_release() {
            local tag=$1 commit=$2 digest=$3
            local dir="$root/$tag"
            mkdir -p "$dir"

            jq -n \
              --arg tag "$tag" \
              --arg commit "$commit" \
              --arg digest "$digest" \
              '{tag:$tag,release_commit:$commit,image:"ghcr.io/ploos-as/gamja",digest:$digest}' \
              > "$dir/release-evidence.json"
            (cd "$dir" && sha256sum release-evidence.json > release-evidence.json.sha256)
            printf '%s\n' '{"fixture":"evidence-bundle"}' > "$dir/release-evidence.bundle.json"

            jq -n \
              --arg tag "$tag" \
              --arg commit "$commit" \
              --arg digest "$digest" \
              '{release:{tag:$tag,commit:$commit},image:{name:"ghcr.io/ploos-as/gamja",digest:$digest}}' \
              > "$dir/release-audit.json"
            (cd "$dir" && sha256sum release-audit.json > release-audit.json.sha256)
            printf '%s\n' '{"fixture":"audit-bundle"}' > "$dir/release-audit.bundle.json"
          }

          make_release v1.0.1 1111111111111111111111111111111111111111 sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          make_release v1.0.0 0000000000000000000000000000000000000000 sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

          scripts/create-release-index.sh "$root" /tmp/m125-index.json
          scripts/verify-release-index.sh /tmp/m125-index.json "$root"
          jq -e '.releases | map(.tag) == ["v1.0.0","v1.0.1"]' /tmp/m125-index.json >/dev/null
          jq -e 'all(.releases[]; ([.evidence.json.sha256,.evidence.checksum.sha256,.evidence.bundle.sha256,.audit.json.sha256,.audit.checksum.sha256,.audit.bundle.sha256] | all(test("^[0-9a-f]{64}$"))))' /tmp/m125-index.json >/dev/null

          cp /tmp/m125-index.json /tmp/m125-tampered.json
          jq '.releases[0].digest="sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"' /tmp/m125-tampered.json > /tmp/m125-tampered-2.json
          if scripts/verify-release-index.sh /tmp/m125-tampered-2.json "$root" >/dev/null 2>&1; then
            echo 'tampered digest unexpectedly accepted' >&2
            exit 1
          fi

          printf '%s\n' '{"drift":true}' >> "$root/v1.0.0/release-audit.bundle.json"
          if scripts/verify-release-index.sh /tmp/m125-index.json "$root" >/dev/null 2>&1; then
            echo 'tampered release asset unexpectedly accepted' >&2
            exit 1
          fi
          printf '%s\n' '{"fixture":"audit-bundle"}' > "$root/v1.0.0/release-audit.bundle.json"

          rm "$root/v1.0.1/release-audit.bundle.json"
          if scripts/create-release-index.sh "$root" /tmp/m125-partial.json >/dev/null 2>&1; then
            echo 'partial M1.24 release state unexpectedly accepted' >&2
            exit 1
          fi

          empty="$(mktemp -d)"
          scripts/create-release-index.sh "$empty" /tmp/m125-empty.json
          scripts/verify-release-index.sh /tmp/m125-empty.json "$empty"
          jq -e '.releases == []' /tmp/m125-empty.json >/dev/null
          rm -rf "$empty"

      - name: Build and verify live M1.25 release transparency index
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/collect-release-index.sh /tmp/release-index.json
          sha256sum /tmp/release-index.json > /tmp/release-index.json.sha256
          jq -e '.schema == "https://github.com/Ploos-AS/gamja/releases/transparency-index/v1" and .milestone == "M1.25"' /tmp/release-index.json >/dev/null

      - name: Archive M1.25 reconstructed transparency snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: release-transparency-${{ github.run_id }}
          path: |
            /tmp/release-index.json
            /tmp/release-index.json.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record M1.25 qualification
        shell: bash
        run: |
          count=$(jq '.releases | length' /tmp/release-index.json)
          {
            echo '### M1.25 release transparency index'
            echo
            echo "- indexed durable M1.24 releases: $count"
            echo '- index is deterministic and ordered bytewise by release tag'
            echo '- every entry binds tag, release commit, image and immutable OCI digest'
            echo '- all six permanent evidence/audit release assets are SHA-256 bound'
            echo '- partial asset states, cross-binding drift and byte tampering are rejected'
            echo '- the index is a reconstructable view; GitHub Release assets remain authoritative'
          } >> "$GITHUB_STEP_SUMMARY"
