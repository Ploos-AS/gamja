name: release-verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAG"
          printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Download release evidence assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gamja-release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'release-evidence.json' \
            --pattern 'release-evidence.json.sha256' \
            --dir /tmp/gamja-release
          test -s /tmp/gamja-release/release-evidence.json
          test -s /tmp/gamja-release/release-evidence.json.sha256

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Verify published release as a consumer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify-release.sh ./scripts/verify-attestations.sh
          ./scripts/verify-release.sh \
            /tmp/gamja-release/release-evidence.json \
            /tmp/gamja-release/release-evidence.json.sha256

      - name: Record M1.15 verification
        run: |
          {
            echo "### M1.15 published release verification"
            echo
            echo "- release: $TAG"
            echo "- evidence checksum: verified"
            echo "- exact OCI revision: verified"
            echo "- Cosign keyless workflow identity: verified"
            echo "- amd64/arm64 SPDX SBOM: verified"
            echo "- amd64/arm64 BuildKit SLSA provenance: verified"
          } >> "$GITHUB_STEP_SUMMARY"
