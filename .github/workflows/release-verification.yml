name: release-verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing M1.20+ release tag to audit; blank selects latest eligible release
        required: false
        type: string
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Select release to audit
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$EVENT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$INPUT_TAG"
          fi

          if [[ -z "$tag" ]]; then
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              metadata="$(gh release view "$candidate" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
              if jq -e '.isDraft == false and any(.assets[]?; .name == "release-evidence.bundle.json")' <<<"$metadata" >/dev/null; then
                tag="$candidate"
                break
              fi
            done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          fi

          if [[ -z "$tag" ]]; then
            echo 'No M1.20-compatible release with signed evidence exists yet.' >> "$GITHUB_STEP_SUMMARY"
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        if: steps.meta.outputs.eligible == 'true'
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Install Cosign
        if: steps.meta.outputs.eligible == 'true'
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Audit published release
        if: steps.meta.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          AUDIT_RECORD_OUT: /tmp/release-audit.json
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/audit-release.sh ./scripts/create-audit-record.sh ./scripts/verify-release.sh ./scripts/verify-attestations.sh ./scripts/validate-release-tag.sh
          ./scripts/audit-release.sh "$TAG"
          test -s "$AUDIT_RECORD_OUT"
          (cd /tmp && sha256sum release-audit.json > release-audit.json.sha256)
          sha256sum -c /tmp/release-audit.json.sha256
          jq -e --arg tag "$TAG" '.milestone == "M1.21" and .release.tag == $tag and (.verification | to_entries | all(.value == true))' "$AUDIT_RECORD_OUT" >/dev/null

      - name: Archive M1.21 audit record
        id: audit_artifact
        if: steps.meta.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: release-audit-${{ steps.meta.outputs.tag }}-${{ github.run_id }}
          path: |
            /tmp/release-audit.json
            /tmp/release-audit.json.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record M1.21 audit
        if: steps.meta.outputs.eligible == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ARTIFACT_DIGEST: ${{ steps.audit_artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.audit_artifact.outputs.artifact-url }}
        run: |
          {
            echo "### M1.21 post-release audit"
            echo
            echo "- release: $TAG"
            echo "- GitHub Release is non-draft and tag identity matches"
            echo "- uploaded release asset set is exactly the three signed-evidence assets"
            echo "- Git tag commit equals release-evidence commit"
            echo "- evidence checksum and M1.19 keyless signature verified"
            echo "- exact OCI revision and image Cosign identity verified"
            echo "- amd64/arm64 SPDX SBOM and BuildKit SLSA provenance verified"
            echo "- recorded amd64/arm64 runtime qualification verified"
            echo "- deterministic M1.21 audit record generated and SHA-256 checked"
            echo "- immutable Actions artifact digest: $ARTIFACT_DIGEST"
            echo "- audit artifact: $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
