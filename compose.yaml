services:
  gamja:
    image: ghcr.io/ploos-as/gamja:latest
    container_name: gamja
    restart: unless-stopped
    environment:
      SOJU_HOST: ${SOJU_HOST:-soju}
      SOJU_PORT: ${SOJU_PORT:-8080}
    ports:
      - "${GAMJA_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
